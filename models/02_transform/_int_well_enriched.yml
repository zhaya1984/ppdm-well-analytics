version: 2

models:
  - name: int_well_enriched
    description: >
      Enriched well-level dataset combining standardised PPDM well attributes,
      current well status classifications, and Santos JV interest mapping.
      Grain is one row per well.

    columns:
      - name: well_id
        description: Unique business identifier for a well.
        tests:
          - not_null
          - unique

      - name: well_name
        description: Name of the well.

      - name: country
        description: Country in which the well is located.

      - name: state_province
        description: State or province in which the well is located.

      - name: basin
        description: Basin associated with the well.

      - name: current_class
        description: Legacy current classification of the well.

      - name: current_status
        description: Legacy current status of the well.

      - name: well_intent
        description: Legacy business intent of the well.

      - name: well_profile
        description: Well trajectory or profile type.

      - name: business_unit_code
        description: Business unit code associated with the well.

      - name: jv_contract_name
        description: JV contract associated with the well.

      - name: well_status_id
        description: Identifier of the current well status record.

      - name: lifecycle
        description: Lifecycle classification of the well.

      - name: business_intention
        description: Business intention classification of the well.

      - name: outcome
        description: Outcome classification of the well, where applicable.

      - name: play_type
        description: Play type classification of the well.

      - name: well_role
        description: Role classification of the well.

      - name: well_condition
        description: Current condition classification of the well.

      - name: product_type
        description: Product type associated with the well, where applicable.

      - name: product_significance
        description: Product significance classification, where applicable.

      - name: santos_interest_pct
        description: Santos interest percentage mapped from the JV contract.

      - name: jv_mapping_status
        description: Indicates whether the JV contract was matched to the reference mapping.
        

      - name: well_source_last_updated_at
        description: Timestamp when the source well record was last updated.

      - name: status_source_last_updated_at
        description: Timestamp when the source well status record was last updated.