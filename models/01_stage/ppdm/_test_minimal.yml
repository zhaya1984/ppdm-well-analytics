version: 2

models:
  - name: stg_ppdm__well
    description: >
      Standardised staging view of synthetic PPDM well data.
      Grain is one row per well.

    columns:
      - name: well_id
        description: Unique business identifier for a well.
        tests:
          - not_null
          - unique

      - name: well_name
        description: Name of the well.

      - name: country
        description: Country in which the well is located.

      - name: state_province
        description: State or province in which the well is located.

      - name: basin
        description: Basin associated with the well.

      - name: current_class
        description: Legacy current classification of the well.

      - name: current_status
        description: Legacy current status of the well.

      - name: well_intent
        description: Legacy business intent of the well.

      - name: well_profile
        description: Well trajectory or profile type.

      - name: business_unit_code
        description: Source business unit code associated with the well.

      - name: jv_contract_name
        description: Current JV contract associated with the well.

      - name: source_last_updated_at
        description: Timestamp when the source record was last updated.

  - name: stg_ppdm__well_status
    description: >
      Standardised staging view of synthetic PPDM well status data.
      Grain is one current status row per well.

    columns:
      - name: well_status_id
        description: Unique identifier for a well status record.
        tests:
          - not_null
          - unique

      - name: well_id
        description: Business identifier of the related well.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_ppdm__well')
                field: well_id

      - name: lifecycle
        description: Lifecycle classification of the well.

      - name: business_intention
        description: Business intention classification of the well.

      - name: outcome
        description: Outcome classification of the well, where applicable.

      - name: play_type
        description: Play type classification of the well.

      - name: well_role
        description: Role classification of the well.

      - name: well_condition
        description: Current condition classification of the well.

      - name: product_type
        description: Product type associated with the well, where applicable.

      - name: product_significance
        description: Product significance classification, where applicable.

      - name: source_last_updated_at
        description: Timestamp when the source status record was last updated.